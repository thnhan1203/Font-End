<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 5: Đoán số may mắn</title>
</head>
<body>
    <h2>Bài tập 5: Đoán số may mắn</h2>
    <label for="guess">Nhập số dự đoán (1-10): </label>
    <input type="number" id="guess" min="1" max="10">
    <br>
    <button onclick="guessNumber()">Đoán</button>
    <p id="result"></p>

    <script>
        function guessNumber() {
            let userGuess = parseInt(document.getElementById("guess").value);
            let luckyNumber = Math.floor(Math.random() * 10) + 1;
            if(userGuess < 1 || userGuess > 10){
                document.getElementById("result").innerHTML = "Vui lòng nhập số từ 1 đến 10!";
            } else if (userGuess === luckyNumber) {
                document.getElementById("result").innerHTML = "Chúc mừng! Bạn đã đoán đúng số may mắn: " + luckyNumber;
            } else {
                document.getElementById("result").innerHTML = "Rất tiếc! Số may mắn là: " + luckyNumber + ". Bạn đoán: " + userGuess;
            }
        }
    </script>
</body>
</html>
