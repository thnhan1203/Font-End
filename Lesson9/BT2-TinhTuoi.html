<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuong trinh tinh tuoi</title>
</head>
<body>
    <h2>chuong trinh tinh tuoi</h2>
    <label for="age">your of birth</label>
    <input type="number" id="year">
    <br>
    <button onclick="calculateAge()">Calculate</button>
    <p id="result"></p>
    <script>
        function calculateAge(){
            let year = document.getElementById("year").value;
            let currentYear = new Date().getFullYear();
            let age = currentYear - year;
            if(year > currentYear) {
                document.getElementById("result").innerHTML = "year khong hop le! nhap lai";
            }else{
                document.getElementById("result").innerHTML = "Tuoi cua ban la: " + age;
            }
        }
    </script>
</body>
</html>
